name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: 3.12
        environment-file: environment.yml
        activate-environment: qcml
        auto-activate-base: false
    
    - name: Install PyTorch Geometric packages
      shell: bash -l {0}
      run: |
        # Install torch-geometric from pre-built wheels (CPU version for CI)
        pip install torch-geometric==2.7.0 huggingface_hub -f https://data.pyg.org/whl/torch-2.10.0+cpu.html
    
    - name: Install package
      shell: bash -l {0}
      run: |
        pip install -e . --no-deps

    - name: Cache Hugging Face pretrained models
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface/hub
        key: hf-pretrained-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml') }}
        restore-keys: |
          hf-pretrained-${{ runner.os }}-

    - name: Download pretrained models from Hugging Face
      shell: bash -l {0}
      run: |
        python - <<'PY'
        import time

        from huggingface_hub import snapshot_download

        patterns = [
            "am_ensemble/*",
            "ap2_ensemble/*",
            "dapnet2/B3LYP-D3aug-cc-pVTZCP_CCSD_LP_T_RP_CBSCP.pt",
        ]

        last_error = None
        for attempt in range(1, 7):
            try:
                snapshot_download(
                    repo_id="awallace3/qcmlforge",
                    allow_patterns=patterns,
                )
                break
            except Exception as exc:
                last_error = exc
                if attempt == 6:
                    raise
                sleep_s = 30 * attempt
                print(
                    "Hugging Face model download failed "
                    f"(attempt {attempt}/6): {exc!r}. Retrying in {sleep_s}s."
                )
                time.sleep(sleep_s)
        PY
    
    - name: Run broad ordinary tests (PolarMACE artifact-free)
      shell: bash -l {0}
      env:
        QCMLFORGE_AUTO_DOWNLOAD_PRETRAINED: "1"
      run: |
        python -m pytest -m "not mace_integration" --junitxml=junit-ordinary.xml tests/

    - name: Produce CI-0 local validation evidence
      if: always()
      shell: bash -l {0}
      run: |
        python scripts/validate_mace_local.py --tier CI-0 --output-dir artifacts/mace-local/ci0

    - name: Produce CI-1 merge-queue validation evidence
      if: always() && github.event_name == 'merge_group'
      shell: bash -l {0}
      run: |
        python scripts/validate_mace_local.py --tier CI-1 --output-dir artifacts/mace-local/ci1

    - name: Upload ordinary JUnit and local evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ordinary-local-validation
        path: |
          junit-ordinary.xml
          artifacts/mace-local/

  built-wheel:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Build wheel
      run: |
        python -m pip install build
        python -m build --wheel --outdir dist
    - name: Inspect wheel denylist and required package files
      run: |
        python scripts/ci/probe_built_wheel.py --wheel "$(find dist -name '*.whl' -print -quit)"
    - name: Probe installed wheel outside checkout
      run: |
        python -m venv /tmp/qcml-wheel
        /tmp/qcml-wheel/bin/pip install "$(find dist -name '*.whl' -print -quit)"
        cd /tmp
        /tmp/qcml-wheel/bin/python "$GITHUB_WORKSPACE/scripts/ci/probe_built_wheel.py" \
          --wheel "$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print -quit)" \
          --checkout "$GITHUB_WORKSPACE" --installed
