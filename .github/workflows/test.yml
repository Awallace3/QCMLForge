name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: 3.12
        environment-file: environment-ci.yml
        activate-environment: qcml
        auto-activate: true
    
    - name: Install PyTorch Geometric packages
      shell: bash -l {0}
      run: |
        # Install CPU-only PyG wheels to match the CI PyTorch build.
        pip install torch-geometric huggingface_hub -f https://data.pyg.org/whl/torch-2.7.0+cpu.html
    
    - name: Install package
      shell: bash -l {0}
      run: |
        pip install -e . --no-deps

    - name: Download pretrained models from Hugging Face
      shell: bash -l {0}
      run: |
        python - <<'PY'
        from huggingface_hub import snapshot_download

        snapshot_download(
            repo_id="awallace3/qcmlforge",
            allow_patterns=["am_ensemble/*", "ap2_ensemble/*"],
        )
        PY
    
    - name: Run tests
      shell: bash -l {0}
      env:
        QCMLFORGE_AUTO_DOWNLOAD_PRETRAINED: "1"
      run: |
        python -m pytest tests/
