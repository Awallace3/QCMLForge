name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: 3.12
        environment-file: environment.yml
        activate-environment: qcml
        auto-activate-base: false
    
    - name: Install PyTorch Geometric packages
      shell: bash -l {0}
      run: |
        # Install torch-geometric from pre-built wheels (CPU version for CI)
        pip install torch-geometric==2.7.0 huggingface_hub -f https://data.pyg.org/whl/torch-2.10.0+cpu.html
    
    - name: Install package
      shell: bash -l {0}
      run: |
        pip install -e . --no-deps

    - name: Cache Hugging Face pretrained models
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface/hub
        key: hf-pretrained-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml') }}
        restore-keys: |
          hf-pretrained-${{ runner.os }}-

    - name: Download pretrained models from Hugging Face
      shell: bash -l {0}
      run: |
        python - <<'PY'
        import time

        from huggingface_hub import snapshot_download

        patterns = [
            "am_ensemble/*",
            "ap2_ensemble/*",
            "dapnet2/B3LYP-D3aug-cc-pVTZCP_CCSD_LP_T_RP_CBSCP.pt",
        ]

        last_error = None
        for attempt in range(1, 7):
            try:
                snapshot_download(
                    repo_id="awallace3/qcmlforge",
                    allow_patterns=patterns,
                )
                break
            except Exception as exc:
                last_error = exc
                if attempt == 6:
                    raise
                sleep_s = 30 * attempt
                print(
                    "Hugging Face model download failed "
                    f"(attempt {attempt}/6): {exc!r}. Retrying in {sleep_s}s."
                )
                time.sleep(sleep_s)
        PY
    
    - name: Run tests
      shell: bash -l {0}
      env:
        QCMLFORGE_AUTO_DOWNLOAD_PRETRAINED: "1"
      run: |
        python -m pytest tests/
