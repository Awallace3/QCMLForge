# CUDA environment for running and testing QCMLForge on NVIDIA GPUs.
#
#   conda env create -f environment-gpu.yml
#   conda activate qcml-gpu
#   pip install -e . --no-deps
#   python -c "import torch; assert torch.cuda.is_available()"
#
# The CPU-only environment (and CI) stays in environment.yml.
#
# This environment uses PyTorch's torch 2.14 CUDA 12.6 wheel so it runs on
# V100s (sm_70). Every torch 2.15 CUDA build targets CUDA 13, which dropped
# Volta: PyPI's 2.15.0 wheel (CUDA 13.2) supports only sm_75 and newer. On sm_75+
# GPUs (RTX 30xx, A100, H100, H200) you can opt into 2.15 after creating the env:
#   pip install torch==2.15.*   # needs a driver supporting CUDA >= 13.2
# conda-forge's pytorch 2.14.1 CUDA builds are not used: they ship
# bin/torch_shm_manager without the executable bit, which hangs DataLoader
# workers under the "file_system" sharing strategy the atom models set.
#
# cuda-version pins CUDA 12.6 headers to match the wheel for torch.compile; it
# needs an NVIDIA driver that supports CUDA >= 12.6 (``nvidia-smi`` "CUDA
# Version"). To solve on a machine without a GPU driver (e.g. a login node),
# prefix the create command with CONDA_OVERRIDE_CUDA=12.6.
name: qcml-gpu
channels:
  - conda-forge
dependencies:
  - numpy=2.*
  - pandas=2.*
  - pip
  - pytest=7.4.4
  - pytest-cov
  - python=3.12.8
  - cuda-version=12.6
  # torch.compile on CUDA compiles a launcher with Triton at runtime; that
  # needs the CUDA headers and a C/C++ compiler inside the environment.
  - cuda-cudart-dev
  - cuda-driver-dev
  - c-compiler
  - cxx-compiler
  - huggingface_hub
  - requests=2.32.3
  - setuptools=72.1.0
  - matplotlib
  - pydantic==2.*
  - scipy
  - tqdm
  - h5py
  - pip:
      # 2.14.1+cu126 outranks PyPI's 2.14.1, whose CUDA build drops sm_70.
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.14.*
      - qcelemental==0.29.0
      # pint 0.26.2 breaks qcelemental 0.29.0's unit registry at import.
      - pint<0.26.2
      - qm-tools-aw==1.4.5
      # Pure-Python wheel; works with the CUDA torch build above.
      - torch-geometric==2.7.0
      - waitress==3.0.2
      - yarl==1.18.3
      - pytorch-minimize
      - qcportal==0.59
      - lmdb==2.1.1
