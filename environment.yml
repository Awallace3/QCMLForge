name: qcml
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - numpy=2.*
  - pandas=2.*
  - pip
  - pytest=7.4.4
  - python=3.12.8
  - requests=2.32.3
  - setuptools=72.1.0
  - matplotlib
  - pydantic==2.*
  - scipy
  - tqdm
  - h5py
  - jsonschema
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.10.0+cu126
      - torchaudio==2.10.0+cu126
      - torchvision==0.25.0+cu126
      - qcelemental==0.29.0
      - qm-tools-aw==1.4.5
      # Install optional PyG wheels after env creation when you need them.
      # CPU example:
      #   pip install torch-geometric==2.7.0 -f https://data.pyg.org/whl/torch-2.10.0+cpu.html
      # CUDA 12.6 example:
      #   pip install torch-geometric==2.7.0 -f https://data.pyg.org/whl/torch-2.10.0+cu126.html
      - waitress==3.0.2
      - yarl==1.18.3
      - pytorch-minimize
      - qcportal==0.59
      - lmdb==2.1.1
