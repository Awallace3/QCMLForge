name: qcml
channels:
  - conda-forge
dependencies:
  - numpy=2.*
  - pandas=2.*
  - pip
  - pytest=7.4.4
  - python=3.12.8
  - requests=2.32.3
  - setuptools=72.1.0
  - matplotlib
  - pydantic==2.*
  - scipy
  - tqdm
  - h5py
  - pip:
      # conda-forge has no pytorch 2.15 build, so torch comes from the PyTorch
      # CPU wheel index (2.15.0+cpu outranks PyPI's CUDA 2.15.0). For CUDA use
      # environment-gpu.yml.
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.15.*
      - qcelemental==0.29.0
      # pint 0.26.2 breaks qcelemental 0.29.0's unit registry at import.
      - pint<0.26.2
      - qm-tools-aw==1.4.5
      # Pure-Python wheel; QCMLForge uses none of the compiled PyG extensions
      # (pyg-lib, torch-scatter, ...), which have no torch-2.15 wheels yet.
      - torch-geometric==2.7.0
      - waitress==3.0.2
      - yarl==1.18.3
      - pytorch-minimize
      - qcportal==0.59
      - lmdb==2.1.1
