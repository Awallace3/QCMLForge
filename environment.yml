name: qcml
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - numpy=2.*
  - pandas=2.*
  - pip
  - pytest=7.4.4
  - python>=3.12
  - pytorch=2.5.1
  - cuda=12.6.*
  - pytorch-mutex=1.0
  - requests=2.32.3
  - setuptools=72.1.0
  - torchaudio
  - torchtriton
  - torchvision
  - matplotlib
  - pydantic=2.*
  - scipy
  - tqdm
  - h5py
  - pip:
      - qcelemental==0.29.0
      - qm-tools-aw==1.4.5
      # For CPU-only systems, change +cu126 to +cpu in the URLs below
      # - torch-geometric==2.6.1 -f https://data.pyg.org/whl/torch-2.5.1+cu126.html
      - waitress==3.0.2
      - yarl==1.18.3
      - pytorch-minimize
      - qcportal==0.59
      - lmdb==1.7.5
