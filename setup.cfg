[options]
packages = find:
zip_safe = True
include_package_data = True
install_requires =
    torch
    qm_tools_aw
    numpy
    huggingface_hub
    lmdb
    h5py

[options.packages.find]
where = src
exclude =
    examples*
    docs*

[options.package_data]
apnet_pt =
    data/*
    models/*
qcml_dftd3 =
    data/*
qcml_mcp =
    data/*

# A MACE-fused checkpoint names its foundation backbone by digest and locator
# rather than embedding it, because that artifact is separately licensed.  The
# exclusion keeps an accidental local copy out of a built wheel.
[options.exclude_package_data]
* =
    *.py[cod]
    __pycache__/*
    *.model
    *.ckpt
