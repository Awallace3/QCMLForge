[options]
packages = find:
zip_safe = True
include_package_data = True
install_requires =
    torch
    qm_tools_aw
    numpy
    huggingface_hub
    lmdb
    h5py

[options.packages.find]
where = src
exclude =
    examples*
    docs*

[options.package_data]
apnet_pt =
    data/*
    models/*
qcml_dftd3 =
    data/*
